[workspace]
resolver = "2"
members = ["crates/paint-core", "crates/paint-cli", "crates/paint-formats", "crates/paint-brush", "crates/paint-studio", "crates/paint-plugin", "crates/paint-3d", "crates/pen-test", "crates/paint-app", "crates/virtual-tablet", "crates/paint-convert", "crates/paint-android-full"]
exclude = ["vendor/egui-wgpu"]

[workspace.package]
edition = "2021"
version = "1.4.6"
license = "MIT"

[profile.dev]
opt-level = 1

# Правила сверх обычного clippy (выбраны из BeautifulRust): ship.sh гоняет clippy с -D warnings.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"      # у каждого unsafe — комментарий SAFETY: почему это безопасно
allow_attributes_without_reason = "warn" # у каждого #[allow] — reason = "…"
redundant_clone = "warn"                 # лишнее копирование
dbg_macro = "warn"
todo = "warn"

# Своя копия egui-wgpu 0.29.1 с одной правкой (vendor/egui-wgpu/PATCHED.md)
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
rfd = { path = "vendor/rfd" }
arboard = { path = "vendor/arboard" }
# Своя копия winit 0.30.13: экспорт наклона и кнопок пера из MotionEvent (см. PATCHED.md)
winit = { path = "vendor/winit" }
